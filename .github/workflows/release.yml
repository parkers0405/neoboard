name: NeoBoard release bundles
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish with updated packaging (blank for build only)
        required: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, asset: linux-x86_64 }
          - { runner: macos-15, asset: darwin-aarch64 }
          - { runner: windows-2025, asset: windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/checkout@v4
        if: inputs.release_tag != ''
        with:
          path: packaging
          ref: ${{ github.sha }}
          sparse-checkout: scripts
      - if: inputs.release_tag != ''
        shell: bash
        run: cp packaging/scripts/* scripts/
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype-dev libgbm-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers libgtk-3-dev
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 build --release --locked --bins
      - run: cargo build --release --locked --bin neochat-desktop
        working-directory: desktop
      # Without the certificate secret the macOS bundle stays ad-hoc signed.
      - name: Load the Developer ID certificate and notarization credentials
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo 'No Developer ID certificate configured: this build is ad-hoc signed.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          keychain="$RUNNER_TEMP/neoboard-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$identity" ] || { echo 'The certificate is not a Developer ID Application identity.'; exit 1; }
          echo "NEOBOARD_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials neoboard-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo 'NEOBOARD_NOTARY_PROFILE=neoboard-notary' >> "$GITHUB_ENV"
            echo "NEOBOARD_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          fi
      - run: python scripts/package-release.py ${{ matrix.asset }}
      - name: Write, restart and read using binaries from the release ZIP
        run: python scripts/smoke-release.py zip dist/neoboard-${{ matrix.asset }}.zip
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: neoboard-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
  image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/checkout@v4
        if: inputs.release_tag != ''
        with:
          path: packaging
          ref: ${{ github.sha }}
          sparse-checkout: scripts
      - run: docker build --tag neoboard:smoke .
      - name: Write, restart and read in the final image
        run: python3 ${{ inputs.release_tag != '' && 'packaging/' || '' }}scripts/smoke-release.py image neoboard:smoke
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [bundle, image-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Verify bundles and publish full release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        working-directory: dist
        run: |
          for asset in neoboard-linux-x86_64.{zip,tar.gz} neoboard-darwin-aarch64.{zip,tar.gz,dmg} neoboard-windows-x86_64.zip NeoBoard-x86_64.msi; do
            test -s "$asset"
            sha256sum --check "$asset.sha256"
          done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "NeoBoard $TAG" --notes 'Before upgrading a host, stop the daemon and back up the entire data directory while it is stopped. For an installer-managed installation, upgrade with the matching installer, not the portable updater. On macOS Apple Silicon, open the DMG and drag NeoBoard to Applications. On Windows x86-64, run the MSI. On Linux x86-64, extract the tarball and run neochat-desktop. Portable archives and SHA-256 checksums are provided.' *.dmg *.msi *.tar.gz *.zip *.sha256
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
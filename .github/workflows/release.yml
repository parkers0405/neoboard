name: NeoBoard release bundles
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish with updated packaging (blank for build only)
        required: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, asset: linux-x86_64 }
          - { runner: macos-15, asset: darwin-aarch64 }
          - { runner: windows-2025, asset: windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/checkout@v4
        if: inputs.release_tag != ''
        with:
          path: packaging
          ref: ${{ github.sha }}
          sparse-checkout: scripts
      - if: inputs.release_tag != ''
        shell: bash
        run: cp packaging/scripts/* scripts/
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype-dev libgbm-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers libgtk-3-dev
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 build --release --locked --bins
      - run: cargo build --release --locked --bin neochat-desktop
        working-directory: desktop
      - run: python scripts/package-release.py ${{ matrix.asset }}
      - name: Write, restart and read using binaries from the release ZIP
        run: python scripts/smoke-release.py zip dist/neoboard-${{ matrix.asset }}.zip
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: neoboard-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
  image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/checkout@v4
        if: inputs.release_tag != ''
        with:
          path: packaging
          ref: ${{ github.sha }}
          sparse-checkout: scripts
      - run: docker build --tag neoboard:smoke .
      - name: Write, restart and read in the final image
        run: python3 ${{ inputs.release_tag != '' && 'packaging/' || '' }}scripts/smoke-release.py image neoboard:smoke
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [bundle, image-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Verify bundles and publish full release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        working-directory: dist
        run: |
          for asset in neoboard-linux-x86_64.{zip,tar.gz} neoboard-darwin-aarch64.{zip,tar.gz,dmg} neoboard-windows-x86_64.zip NeoBoard-x86_64.msi; do
            test -s "$asset"
            sha256sum --check "$asset.sha256"
          done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "NeoBoard $TAG" --notes 'Before upgrading a host, stop the daemon and back up the entire data directory while it is stopped. For an installer-managed installation, upgrade with the matching installer, not the portable updater. On macOS Apple Silicon, open the DMG and drag NeoBoard to Applications. On Windows x86-64, run the MSI. On Linux x86-64, extract the tarball and run neochat-desktop. Portable archives and SHA-256 checksums are provided.' *.dmg *.msi *.tar.gz *.zip *.sha256
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
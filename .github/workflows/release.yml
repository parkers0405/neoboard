name: NeoBoard release bundles
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, asset: linux-x86_64 }
          - { runner: macos-15, asset: darwin-aarch64 }
          - { runner: windows-2025, asset: windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype-dev libgbm-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers libgtk-3-dev
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 build --release --locked --bins
      - run: cargo build --release --locked --bin neochat-desktop
        working-directory: desktop
      - run: python scripts/package-release.py ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: neoboard-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Verify bundles and publish full release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          for platform in linux-x86_64 darwin-aarch64 windows-x86_64; do
            sha256sum --check "neoboard-$platform.zip.sha256"
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "NeoBoard $GITHUB_REF_NAME" --notes 'First public beta. Download the archive for your system, extract the entire folder, and launch neochat-desktop. The daemon, CLI, and MCP adapter are included.' *.zip *.zip.sha256
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
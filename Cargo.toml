[package]
name = "neochat"
version = "0.2.7"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
opentunnel = "=0.5.1"
rand = "0.8"
ring = "0.17"
rpassword = "7.5.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Board uses local SQL/JSON, not the optional full-text index or global allocator.
turso = { version = "=0.8.3", default-features = false }
futures-executor = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "neochatd"
path = "src/bin/neochatd.rs"
[package]
name = "neochat"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
opentunnel = "=0.5.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "neochatd"
path = "src/bin/neochatd.rs"
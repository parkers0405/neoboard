[package]
name = "neochat-desktop"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Standalone native Rune board and task inspector"

[workspace]

[features]
default = ["native-picker"]
native-picker = ["rune/native-file-dialog"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
neochat = { path = ".." }
rune = { path = "../rune/crates/rune" }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
winit = { path = "../vendor/winit-compat/winit-0.30.13" }
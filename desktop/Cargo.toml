[package]
name = "neochat-desktop"
version = "0.2.8"
edition = "2024"
license = "MIT"
description = "Standalone native Rune board and task inspector"

[workspace]

[features]
default = ["native-picker"]
native-picker = ["rune/native-file-dialog"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
zeroize = "1"
neochat = { path = ".." }
rune = { path = "../rune/crates/rune" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[patch.crates-io]
winit = { path = "../vendor/winit-compat/winit-0.30.13" }